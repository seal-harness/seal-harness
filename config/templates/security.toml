# Seal Harness security configuration - ~/.seal/security.toml
#
# Boot-only and agent-immutable: no opcode, tool or agent can read or write this
# file, and it deliberately does not live inside ~/.seal/config (which is a git
# repository an agent may commit to). Only human-driven admin commands change
# it: `seal vault setup`, and the `seal access-control ...` commands.
#
# Seal writes this file once, on first run, and never overwrites it: edit it
# freely. Every key is optional. A commented key is commented out on purpose -
# either its default is "unset", or writing it would pin a path that is only
# true on this machine, or the value is a security decision only you should
# make. The comment states what Seal uses when the key is absent.
#
# Seal re-encodes this file when it changes it (`seal access-control ...`,
# `/vault setup`), and a re-encode does not preserve comments. Keep a copy of
# anything you care about.

# ---------------------------------------------------------------------------
# Vault
# ---------------------------------------------------------------------------
# `seal vault setup` fills these in. The vault file defaults to
# <seal home>/config/vault/vault.age and the age identity stays under keys/,
# which is outside the git-versioned config tree.

# vault_path      = "/absolute/path/to/vault.age"
# vault_recipient = "age1..."        # age public key
# vault_identity  = "/absolute/path/to/identity.txt"

# Display label for the key type: x25519 | yubikey | user.
vault_key_type = "x25519"

# When the vault is unlocked: startup | on_demand | per_access.
# on_demand asks on first use, which is why it is the default.
vault_unlock = "on_demand"

# ---------------------------------------------------------------------------
# Where untrusted code runs
# ---------------------------------------------------------------------------
# Left commented out rather than written as the default: the setting interacts
# with how the binary was built. A build made with `-f remote-only-untrusted`
# has no local executor, and an absent table is what tells it so; writing
# mode = "local" there would change its behaviour.
#
# [untrusted_execution]
# mode = "local"                     # local | remote
#
# Remote execution fail-closes at call time when this block is incomplete: a
# half-configured remote refuses to run rather than falling back to local.
# [untrusted_execution.remote]
# host        = "builder.example.com"
# user        = "seal"
# port        = 22
# identity    = "/home/you/.ssh/id_ed25519"
# known_hosts = "/home/you/.ssh/known_hosts"   # mandatory: host keys are pinned
# workspace   = "/srv/seal/workspace"

# ---------------------------------------------------------------------------
# Passkey access control for the web gateway
# ---------------------------------------------------------------------------
# Three states, and the difference between the first two matters:
#
#   * no table at all  -> unconfigured. The API is closed and the first browser
#     visit shows a setup screen. This is the default, and the reason the table
#     below is commented out: absence never means "open".
#   * mode = "none"    -> open. An explicit waiver, written only by
#     `seal access-control disable --yes`.
#   * mode = "passkey" -> every request needs a passkey-backed session.
#
# Enrolled passkeys are not stored here. They live in ~/.seal/credentials.toml,
# which the gateway owns at mode 0600.
#
# [access_control]
# mode = "passkey"
#
# Only needed when a TLS reverse proxy fronts the gateway; otherwise the origin
# is derived from [gateway] host/port at boot. rp_id defaults to the origin's
# host and must be a domain name - a passkey can never be bound to an IP.
# origin = "https://seal.example.com"
# rp_id  = "seal.example.com"
