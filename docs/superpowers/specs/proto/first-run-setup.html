<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Seal Harness — first-run setup (UI prototype)</title>
<style>
  /* ── Real tokens, copied from frontend/design-tokens.css ─────────────── */
  :root {
    --bg-base:#0F1117; --bg-sunken:#0B0D13; --bg-surface:#161922; --bg-elevated:#1E2235;
    --accent-primary:#7C6CF6; --accent-secondary:#4F8EF7;
    --text-primary:#E8E9F0; --text-muted:#9598B8; --text-faint:#8A8FAD;
    --border:#252A40; --needs-input:#FF6B6B; --success:#34D399; --warning:#FBBF24;
    --surface-hover:rgba(255,255,255,0.03);
    --text-xs:.75rem; --text-sm:.875rem;
    --tracking-tighter:-0.02em; --tracking-tight:-0.01em;
    --leading-tight:1.2; --leading-normal:1.5; --leading-relaxed:1.6;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
    --sidebar-width:280px; --topbar-height:52px; --logo-size:28px;
    --radius-sm:4px; --radius-md:6px; --radius-lg:8px; --radius-full:9999px;
    --duration-fast:150ms; --duration-slow:300ms;
    --ease-out:cubic-bezier(0.16,1,0.3,1);
    /* One knob for the coach's dimming strength */
    --coach-dim:28%;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg-base); color:var(--text-primary);
    font-family:'Geist Sans',system-ui,-apple-system,sans-serif;
    font-size:var(--text-sm); line-height:var(--leading-normal);
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ── Top bar ─────────────────────────────────────────────────────────── */
  .topbar {
    height:var(--topbar-height); flex:0 0 auto; display:flex; align-items:center;
    gap:var(--space-4); padding:0 var(--space-4);
    border-bottom:1px solid var(--border); background:var(--bg-surface);
  }
  .brand { display:flex; align-items:center; gap:10px; }
  .logo {
    width:var(--logo-size); height:var(--logo-size); border-radius:var(--radius-md);
    background:linear-gradient(160deg,#2B3350,#161B2B);
    display:grid; place-items:center; font-size:13px; font-weight:600; color:#C9CBE8;
    border:1px solid #333A57;
  }
  .brand-name { font-weight:600; letter-spacing:var(--tracking-tighter); }
  nav { display:flex; gap:2px; }
  .navbtn {
    font:inherit; font-size:var(--text-sm); font-weight:500; cursor:pointer;
    padding:5px 10px; border-radius:var(--radius-md); border:1px solid transparent;
    background:transparent; color:var(--text-muted);
    transition:background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
  }
  .navbtn:hover { background:var(--surface-hover); }
  .navbtn.active { background:var(--bg-elevated); color:var(--text-primary); border-color:var(--border); }
  .spacer { flex:1; }
  .version {
    font-size:var(--text-xs); padding:6px 10px; border-radius:var(--radius-md);
    background:var(--bg-elevated); color:var(--text-faint); border:1px solid var(--border);
  }
  /* Re-entry point — only appears once the user has skipped the coach */
  .setup-pill {
    font:inherit; font-size:var(--text-xs); font-weight:500; cursor:pointer;
    display:flex; align-items:center; gap:6px;
    padding:6px 10px; border-radius:var(--radius-full);
    background:rgba(124,108,246,.14); color:#B9AFFF; border:1px solid rgba(124,108,246,.35);
  }
  .setup-pill .dot { width:6px; height:6px; border-radius:50%; background:var(--accent-primary); }

  /* ── Body layout ─────────────────────────────────────────────────────── */
  .body { flex:1; min-height:0; display:flex; }
  .sidebar {
    width:var(--sidebar-width); flex:0 0 auto; background:var(--bg-surface);
    border-right:1px solid var(--border); overflow-y:auto; padding:var(--space-2) 0;
  }
  .side-head {
    display:flex; align-items:center; justify-content:space-between;
    padding:6px var(--space-3); font-size:var(--text-xs); font-weight:600;
    text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted);
    border-bottom:1px solid var(--border);
  }
  .empty-side { padding:var(--space-4) var(--space-3); font-size:var(--text-xs); color:var(--text-faint); }

  .main { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--bg-base); }
  .main.scroll { overflow-y:auto; }
  .center-empty {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:var(--space-3); color:var(--text-faint); padding:var(--space-6); text-align:center;
  }
  .center-empty .big { font-size:var(--text-sm); color:var(--text-muted); }

  /* ── Form primitives ─────────────────────────────────────────────────── */
  .pane { padding:var(--space-6) 32px; max-width:720px; margin:0 auto; width:100%; }
  .h1 { font-size:1.125rem; font-weight:600; }
  .lede { color:var(--text-muted); margin-top:var(--space-2); }
  .field { display:grid; grid-template-columns:140px 1fr; gap:var(--space-3); align-items:start; margin-top:var(--space-4); }
  .label { font-size:var(--text-xs); font-weight:500; color:var(--text-muted); padding-top:8px; }
  .input {
    width:100%; font:inherit; font-size:var(--text-sm); padding:6px 10px;
    background:var(--bg-sunken); border:1px solid var(--border);
    border-radius:var(--radius-sm); color:var(--text-primary); outline:none;
  }
  .hint { font-size:11px; color:var(--text-faint); margin-top:4px; }
  .btn {
    font:inherit; font-size:var(--text-sm); font-weight:500; cursor:pointer;
    padding:8px var(--space-3); border-radius:var(--radius-lg); border:1px solid transparent;
    transition:background var(--duration-fast) var(--ease-out);
  }
  .btn:active { transform:translateY(.5px); }
  .btn-primary { background:var(--accent-primary); color:#fff; }
  .btn-primary:hover { background:#8B7DF7; }
  .btn-ghost { background:var(--bg-elevated); color:var(--text-muted); border-color:var(--border); }
  .btn-ghost:hover { background:#252A40; color:var(--text-primary); }
  .btn-link { background:none; border:none; color:var(--accent-secondary); padding:0; font:inherit; cursor:pointer; }

  .choice {
    display:flex; gap:var(--space-3); padding:var(--space-3);
    border:1px solid var(--border); border-radius:var(--radius-lg);
    background:var(--bg-surface); cursor:pointer; align-items:flex-start;
  }
  .choice + .choice { margin-top:var(--space-2); }
  .choice.on { border-color:var(--accent-primary); background:rgba(124,108,246,.08); }
  .choice.off { opacity:.55; cursor:not-allowed; }
  .radio {
    width:14px; height:14px; border-radius:50%; border:1.5px solid var(--border);
    margin-top:2px; flex:0 0 auto; display:grid; place-items:center;
  }
  .choice.on .radio { border-color:var(--accent-primary); }
  .choice.on .radio::after { content:''; width:7px; height:7px; border-radius:50%; background:var(--accent-primary); }
  .choice .name { font-weight:500; }
  .choice .desc { font-size:var(--text-xs); color:var(--text-muted); margin-top:2px; }
  .tag {
    font-size:11px; padding:1px 6px; border-radius:var(--radius-full);
    background:var(--bg-elevated); color:var(--text-faint); border:1px solid var(--border);
    margin-left:6px; font-weight:400;
  }

  .prov-row {
    display:flex; align-items:center; gap:var(--space-3);
    padding:10px var(--space-3); border-bottom:1px solid var(--border); cursor:pointer;
  }
  .prov-row:last-child { border-bottom:none; }
  .prov-row:hover { background:var(--surface-hover); }
  .badge {
    font-size:11px; padding:1px 7px; border-radius:var(--radius-full);
    border:1px solid var(--border); background:var(--bg-elevated); color:var(--text-faint);
  }
  .plus { width:22px; height:22px; padding:0; font-size:14px; line-height:1; display:grid; place-items:center; }

  /* ── The coach ───────────────────────────────────────────────────────── */
  /* ONE element. The huge spread dims everything except the target, so the
   * target is the only fully-lit thing on screen — no separate scrim and no
   * cut-out needed. pointer-events:none keeps the whole UI usable. */
  .ring {
    position:fixed; border-radius:var(--radius-lg);
    box-shadow:0 0 0 2px var(--accent-primary),
               0 0 0 9999px rgba(0,0,0,var(--coach-dim));
    pointer-events:none; z-index:9000;
    transition:left var(--duration-slow) var(--ease-out), top var(--duration-slow) var(--ease-out),
               width var(--duration-slow) var(--ease-out), height var(--duration-slow) var(--ease-out);
  }

  /* Full card — used while the user is NOT yet on the step's own screen */
  .card {
    position:fixed; z-index:9000; width:340px;
    background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:var(--space-4);
    box-shadow:0 16px 48px rgba(0,0,0,.55); pointer-events:auto;
    transition:opacity var(--duration-fast) var(--ease-out);
  }
  .eyebrow {
    display:flex; align-items:center; gap:var(--space-2);
    font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:#B9AFFF;
  }
  .steps { display:flex; gap:5px; margin-left:auto; }
  .steps i { width:16px; height:3px; border-radius:2px; background:var(--border); }
  .steps i.on { background:var(--accent-primary); }
  .card h3 { margin:var(--space-3) 0 0; font-size:15px; font-weight:600; letter-spacing:var(--tracking-tight); }
  .card p { margin:var(--space-2) 0 0; font-size:var(--text-xs); line-height:var(--leading-relaxed); color:var(--text-muted); }
  .card .actions { display:flex; align-items:center; gap:var(--space-2); margin-top:var(--space-4); }
  .card .actions .skip { margin-left:auto; }
  .card .note { margin-top:10px; font-size:11px; color:var(--text-faint); }

  /* Compact pointer — used once the user is already on the right screen, so
   * the card stops covering the very form it is asking them to fill in. */
  .chip {
    position:fixed; z-index:9000; pointer-events:auto;
    display:flex; align-items:center; gap:10px;
    padding:6px 8px 6px 12px; border-radius:var(--radius-full);
    background:var(--bg-elevated); border:1px solid var(--accent-primary);
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    font-size:var(--text-xs); color:var(--text-primary); white-space:nowrap;
    transition:left var(--duration-slow) var(--ease-out), top var(--duration-slow) var(--ease-out);
  }
  .chip .caret {
    position:absolute; top:-5px; left:var(--caret-x,20px);
    width:9px; height:9px; background:var(--bg-elevated);
    border-left:1px solid var(--accent-primary); border-top:1px solid var(--accent-primary);
    transform:rotate(45deg);
  }
  .chip .who { font-weight:600; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#B9AFFF; }
  .chip .x {
    all:unset; cursor:pointer; display:grid; place-items:center;
    width:18px; height:18px; border-radius:50%; color:var(--text-faint); font-size:13px; line-height:1;
  }
  .chip .x:hover { background:var(--surface-hover); color:var(--text-primary); }

  /* ── Prototype chrome (not part of the design) ───────────────────────── */
  .proto {
    position:fixed; right:16px; bottom:16px; z-index:9500;
    background:#11141d; border:1px solid var(--border); border-radius:10px;
    padding:10px; display:flex; flex-direction:column; gap:6px; width:264px;
    box-shadow:0 12px 40px rgba(0,0,0,.6);
  }
  .proto .pt { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); }
  .proto button {
    font:inherit; font-size:11px; text-align:left; cursor:pointer; padding:6px 8px;
    background:var(--bg-surface); color:var(--text-muted);
    border:1px solid var(--border); border-radius:6px;
  }
  .proto button.on { background:var(--bg-elevated); color:var(--text-primary); border-color:var(--accent-primary); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">S</div>
    <span class="brand-name">Seal Harness</span>
  </div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <button class="setup-pill" id="pill" hidden><span class="dot"></span>Setup&nbsp;·&nbsp;<span id="pillstep">1</span>&nbsp;of&nbsp;2</button>
  <div class="version">v0.1.0</div>
</div>

<div class="body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<div class="ring" id="ring" hidden></div>

<div class="card" id="card" hidden>
  <div class="eyebrow">
    <span id="eyebrow">Step 1 of 2</span>
    <span class="steps" id="steps"><i></i><i></i></span>
  </div>
  <h3 id="ctitle"></h3>
  <p id="cbody"></p>
  <div class="actions">
    <button class="btn btn-primary" id="ccta" hidden></button>
    <button class="btn btn-link skip" id="cskip">Skip for now</button>
  </div>
  <div class="note" id="cnote" hidden>Nothing is blocked — you can click anywhere behind this.</div>
</div>

<div class="chip" id="chip" hidden>
  <div class="caret" id="caret"></div>
  <span class="who" id="chipeyebrow">Step 1 of 2</span>
  <span id="chiptext"></span>
  <button class="x" id="chipx" title="Hide">✕</button>
</div>

<div class="proto">
  <div class="pt">Prototype state</div>
  <button data-state="1">1 · First load — nothing configured</button>
  <button data-state="2">2 · On Secrets — create vault</button>
  <button data-state="3">3 · Vault done → provider step</button>
  <button data-state="4">4 · On Providers — add provider</button>
  <button data-state="5">5 · Set up — coach gone</button>
  <button data-state="6">6 · Vault broken — key missing</button>
  <button data-state="7">7 · Skipped — pill only</button>
</div>

<script>
const SECTIONS = ['sessions','providers','agents','skills','repos','secrets'];
const LABELS = {sessions:'Sessions',providers:'Providers',agents:'Agents',skills:'Skills',repos:'Repos',secrets:'Secrets'};
const nav = document.getElementById('nav');
SECTIONS.forEach(s => {
  const b = document.createElement('button');
  b.className = 'navbtn'; b.textContent = LABELS[s];
  b.dataset.nav = s; b.dataset.target = s + '-nav';
  nav.appendChild(b);
});

const sidebar = document.getElementById('sidebar');
const main = document.getElementById('main');
const ringEl = document.getElementById('ring');
const cardEl = document.getElementById('card');
const chipEl = document.getElementById('chip');

/* ── Views ─────────────────────────────────────────────────────────────── */
function sessionsView(done) {
  sidebar.innerHTML = `
    <div class="side-head"><span>Agents</span><span class="plus" style="font-size:13px">+</span></div>
    <div class="empty-side">No tabs yet. Start by creating a new tab.</div>`;
  main.className = 'main';
  main.innerHTML = done
    ? `<div class="center-empty">
         <div class="big">Ready when you are</div>
         <div>Anthropic is connected. Press <b>+</b> to start your first tab.</div>
         <button class="btn btn-primary" style="margin-top:8px">New tab</button>
       </div>`
    : `<div class="center-empty">
         <div class="big">Nothing running yet</div>
         <div>Press <b>+</b> in the sidebar, or pick a session to resume.</div>
         <button class="btn btn-ghost" style="margin-top:8px">New tab</button>
       </div>`;
}

function secretsView(broken) {
  sidebar.innerHTML = `
    <div class="side-head"><span>Secrets</span><span class="plus" style="font-size:13px">+</span></div>
    <div class="empty-side">${broken ? 'The vault could not be opened.' : 'No secrets yet.'}</div>`;
  main.className = 'main scroll';
  if (broken) {
    main.innerHTML = `<div class="pane">
      <div class="h1">Your vault's key file is missing</div>
      <p class="lede">Seal has a vault and a key record, but the key file itself is gone.</p>
      <div class="field">
        <span class="label">Key file</span>
        <div><div class="input" style="font-family:ui-monospace,monospace;color:var(--text-muted)">~/.seal/keys/default.identity</div>
        <div class="hint">Missing. Restore it, or re-run <b>/vault setup</b> in a terminal.</div></div>
      </div>
      <div class="field">
        <span class="label">Key type</span>
        <div><span class="badge">x25519</span></div>
      </div>
      <div style="margin-top:24px;border-top:1px solid var(--border);padding-top:16px">
        <div class="hint">Without the key there's nothing Seal can do from here — this one needs whoever set the vault up.</div>
      </div>
    </div>`;
    return;
  }
  main.innerHTML = `<div class="pane">
    <div class="h1">Your API keys stay on this machine</div>
    <p class="lede">They're encrypted at rest, and the vault is the lock. Create it once — after that, storing a key is just a normal form.</p>
    <div class="field">
      <span class="label">Protect it with</span>
      <div>
        <div class="choice on">
          <div class="radio"></div>
          <div><div class="name">A local key <span class="tag">recommended</span></div>
            <div class="desc">Generated here, stored under <code>~/.seal/keys/</code>. One click, nothing to remember.</div></div>
        </div>
        <div class="choice off">
          <div class="radio"></div>
          <div><div class="name">A YubiKey <span class="tag">terminal only</span></div>
            <div class="desc">The key never leaves the token — but it needs a PIN prompt the browser can't give yet.</div></div>
        </div>
      </div>
    </div>
    <div style="margin-top:24px;border-top:1px solid var(--border);padding-top:16px;display:flex;gap:8px">
      <button class="btn btn-primary" id="vault-create" data-target="vault-create">Create vault</button>
      <button class="btn btn-ghost">Cancel</button>
    </div>
  </div>`;
}

function providersView() {
  sidebar.innerHTML = `
    <div class="side-head"><span>Providers</span><span class="plus" style="font-size:13px">+</span></div>`;
  main.className = 'main scroll';
  main.innerHTML = `<div class="pane">
    <div class="h1">This is what answers your messages</div>
    <p class="lede">Add a provider and Seal can start a conversation. Ollama running locally? That needs no key at all.</p>
    <div style="margin-top:20px;border:1px solid var(--border);border-radius:8px;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border)">
        <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)">Providers</span>
        <button class="btn btn-ghost plus" id="provider-new" data-target="provider-new" title="New provider">+</button>
      </div>
      ${['anthropic','ollama','openrouter'].map(n =>
        `<div class="prov-row"><div style="flex:1"><div>${n}</div>
          <div class="hint" style="margin:2px 0 0">Not configured</div></div>
          <span class="badge">None</span></div>`).join('')}
    </div>
    <div class="hint" style="margin-top:10px">Pick a provider, then paste a key — or point at your local Ollama server.</div>
  </div>`;
}

/* ── Coach: full card, or a compact pointer when already on the right screen ── */
function hideCoach() {
  ringEl.hidden = true; cardEl.hidden = true; chipEl.hidden = true;
}

function placeRing(el) {
  const r = el.getBoundingClientRect();
  Object.assign(ringEl.style, {
    left:`${r.left-6}px`, top:`${r.top-6}px`,
    width:`${r.width+12}px`, height:`${r.height+12}px`,
  });
  ringEl.hidden = false;
  return r;
}

function showCard(o) {
  chipEl.hidden = true; cardEl.hidden = false;
  document.getElementById('eyebrow').textContent = o.eyebrow;
  document.getElementById('steps').innerHTML = [1,2].map(i => `<i class="${i<=o.step?'on':''}"></i>`).join('');
  document.getElementById('ctitle').textContent = o.title;
  document.getElementById('cbody').textContent = o.body;
  const c = document.getElementById('ccta');
  c.hidden = !o.cta; if (o.cta) c.textContent = o.cta;
  document.getElementById('cnote').hidden = !o.note;

  const targetEl = document.querySelector(`[data-target="${o.target}"]`);
  if (!targetEl) { ringEl.hidden = true; return; }
  const r = placeRing(targetEl);

  const cw = 340, gap = 14;
  cardEl.style.left = `${Math.min(Math.max(16, r.left - 8), innerWidth - cw - 16)}px`;
  cardEl.style.top = `${r.bottom + gap}px`;
  requestAnimationFrame(() => {
    const ch = cardEl.offsetHeight;
    if (r.bottom + gap + ch > innerHeight - 16) {
      cardEl.style.top = `${Math.max(16, r.top - ch - gap)}px`;
    }
  });
}

/* Compact pointer: one line, sitting right beside the control. Used once the
 * user is already on the step's screen, so the form stays uncovered. */
function showChip(o) {
  cardEl.hidden = true; chipEl.hidden = false;
  document.getElementById('chipeyebrow').textContent = o.eyebrow;
  document.getElementById('chiptext').textContent = o.text;

  const targetEl = document.querySelector(`[data-target="${o.target}"]`);
  if (!targetEl) { ringEl.hidden = true; chipEl.hidden = true; return; }
  const r = placeRing(targetEl);

  // measure, then sit below the target (or above when there is no room)
  chipEl.style.left = '0px'; chipEl.style.top = '0px';
  const w = chipEl.offsetWidth, h = chipEl.offsetHeight;
  const left = Math.min(Math.max(16, r.left + r.width/2 - w/2), innerWidth - w - 16);
  let top = r.bottom + 12;
  let caretAbove = true;
  if (top + h > innerHeight - 16) { top = Math.max(16, r.top - h - 12); caretAbove = false; }
  chipEl.style.left = `${left}px`;
  chipEl.style.top = `${top}px`;

  const caret = document.getElementById('caret');
  const cx = Math.min(Math.max(12, r.left + r.width/2 - left - 4.5), w - 22);
  caret.style.setProperty('--caret-x', `${cx}px`);
  caret.style.top = caretAbove ? '-5px' : 'auto';
  caret.style.bottom = caretAbove ? 'auto' : '-5px';
  caret.style.borderLeft = caretAbove ? '1px solid var(--accent-primary)' : 'none';
  caret.style.borderTop = caretAbove ? '1px solid var(--accent-primary)' : 'none';
  caret.style.borderRight = caretAbove ? 'none' : '1px solid var(--accent-primary)';
  caret.style.borderBottom = caretAbove ? 'none' : '1px solid var(--accent-primary)';
}

/* Pill is the re-entry point, and only exists once the coach has been dismissed */
function setPill(visible, step) {
  const pill = document.getElementById('pill');
  pill.hidden = !visible;
  if (step) document.getElementById('pillstep').textContent = String(step);
}

/* ── Prototype state machine ───────────────────────────────────────────── */
let currentStep = 1;

function render(state) {
  document.querySelectorAll('.proto button').forEach(b => b.classList.toggle('on', b.dataset.state === state));
  hideCoach(); setPill(false);
  document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('active'));

  if (state === '1') {                       // not on the right screen → full card
    sessionsView(false);
    document.querySelector('[data-nav="sessions"]').classList.add('active');
    currentStep = 1;
    showCard({
      target:'secrets-nav', eyebrow:'Step 1 of 2', step:1,
      title:'Your keys get encrypted here',
      body:'The vault is the lock they live behind, and creating it takes one click. No terminal, nothing to remember.',
      cta:'Open Secrets', note:true,
    });
  }
  else if (state === '2') {                  // already on the screen → compact pointer
    secretsView(false);
    document.querySelector('[data-nav="secrets"]').classList.add('active');
    currentStep = 1;
    showChip({
      target:'vault-create', eyebrow:'Step 1 of 2',
      text:'A local key just works — press Create vault',
    });
  }
  else if (state === '3') {
    sessionsView(false);
    document.querySelector('[data-nav="sessions"]').classList.add('active');
    currentStep = 2;
    showCard({
      target:'providers-nav', eyebrow:'Step 2 of 2', step:2,
      title:'This is what answers your messages',
      body:'Add a provider and the vault finally pays off. Ollama running locally needs no key at all.',
      cta:'Open Providers', note:true,
    });
  }
  else if (state === '4') {
    providersView();
    document.querySelector('[data-nav="providers"]').classList.add('active');
    currentStep = 2;
    showChip({
      target:'provider-new', eyebrow:'Step 2 of 2',
      text:'Ollama needs no key at all',
    });
  }
  else if (state === '5') {
    sessionsView(true);
    document.querySelector('[data-nav="sessions"]').classList.add('active');
  }
  else if (state === '6') {
    secretsView(true);
    document.querySelector('[data-nav="secrets"]').classList.add('active');
    currentStep = 1;
    showCard({
      target:'secrets-nav', eyebrow:'Setup', step:1,
      title:"Your vault's key file is missing",
      body:"Seal can see a vault but not the key that opens it. Open Secrets to see exactly what's missing.",
      cta:'Open Secrets', note:true,
    });
  }
  else if (state === '7') {                  // skipped → pill only
    sessionsView(false);
    document.querySelector('[data-nav="sessions"]').classList.add('active');
    setPill(true, 1);
  }
}

/* Dismissing the coach leaves the pill behind — never a one-way door */
function dismiss() { hideCoach(); setPill(true, currentStep); }

document.querySelectorAll('.proto button').forEach(b => b.onclick = () => render(b.dataset.state));
document.getElementById('cskip').onclick = dismiss;
document.getElementById('chipx').onclick = dismiss;
document.getElementById('ccta').onclick = () => {
  // "Open Secrets" / "Open Providers" would navigate; the prototype jumps to
  // the state for that screen so you can see the hand-off.
  const step = currentStep;
  render(step === 1 ? '2' : '4');
};
document.getElementById('pill').onclick = () => render(currentStep === 1 ? '1' : '3');
addEventListener('resize', () => {
  const on = document.querySelector('.proto button.on');
  if (on) render(on.dataset.state);
});

render('1');
</script>
</body>
</html>
