name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow re-running the pipeline by hand (e.g. after a cache purge).
  workflow_dispatch:

# Cancel outdated runs when a new push arrives on the same ref
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The gate lives in gate.yml so that release.yml runs the identical set of
  # checks on a tag. See that file for what it enforces.
  gate:
    name: Gate (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    uses: ./.github/workflows/gate.yml
    with:
      system: ${{ matrix.system }}
      runner: ${{ matrix.runner }}
      # PR builds from forks get no secrets, so the push is skipped there.
      push-cache: true
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────────
  # Package the built binary as a download artifact, so users can grab a
  # binary straight from a CI run without installing Nix.
  # ─────────────────────────────────────────────────────────────────────────
  package:
    name: Package (${{ matrix.system }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Restore Nix store cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Build
        run: nix build --print-build-logs

      - name: Package binary artifact
        run: ./scripts/package-release.sh "${{ matrix.system }}" "" "seal-${{ matrix.system }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: seal-${{ matrix.system }}
          path: |
            seal-${{ matrix.system }}.tar.gz
            seal-${{ matrix.system }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # GitHub Pages: publish the HPC coverage HTML + the OpenAPI spec + a
  # Swagger UI page to gh-pages on every merge to main.
  # Runs only on the linux matrix entry (one deploy, not per-arch) and only on
  # pushes to main — the gh-pages branch is main-only for v1.
  # ─────────────────────────────────────────────────────────────────────────
  pages:
    name: Deploy docs to Pages
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download gate docs (linux)
        uses: actions/download-artifact@v4
        with:
          name: gate-docs-x86_64-linux
          path: gate-docs
        continue-on-error: true

      - name: Fetch existing gh-pages content
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-current
        continue-on-error: true

      - name: Assemble Pages content
        run: |
          PAGES_BASE="https://seal-harness.github.io/seal-harness"
          mkdir -p deploy/coverage deploy/api

          # Carry forward existing content from gh-pages
          if [ -d gh-pages-current/coverage ]; then
            cp -r gh-pages-current/coverage/* deploy/coverage/ 2>/dev/null || true
          fi
          if [ -d gh-pages-current/api ]; then
            cp -r gh-pages-current/api/* deploy/api/ 2>/dev/null || true
          fi

          # Overwrite the main coverage report with this build's
          rm -rf deploy/coverage/main
          if [ -d gate-docs/new-coverage ]; then
            mkdir -p deploy/coverage/main
            cp -r gate-docs/new-coverage/* deploy/coverage/main/
          fi

          if [ -s gate-docs/openapi.json ]; then
            cp gate-docs/openapi.json deploy/api/openapi.json
          fi

          cat > deploy/api/index.html << 'SWAGGER'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Seal Harness API Docs</title>
            <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css">
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
            <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js"></script>
            <script>
              window.onload = function() {
                SwaggerUIBundle({
                  url: 'openapi.json',
                  dom_id: '#swagger-ui',
                  deepLinking: true,
                  presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
                  layout: 'StandaloneLayout'
                });
              };
            </script>
          </body>
          </html>
          SWAGGER

          cat > deploy/index.html << 'INDEX'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Seal Harness — Docs</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; color: #24292f; }
              h1 { border-bottom: 1px solid #d0d7de; padding-bottom: 8px; }
              a { color: #0969da; text-decoration: none; font-size: 1.1em; display: block; padding: 12px 0; }
              a:hover { text-decoration: underline; }
              .desc { color: #656d76; font-size: 0.9em; }
            </style>
          </head>
          <body>
            <h1>Seal Harness</h1>
            <a href="coverage/main/hpc_index.html">Code Coverage Report</a>
            <p class="desc">HPC line/branch coverage for the current main build.</p>
            <a href="api/index.html">API Docs (Swagger UI)</a>
            <p class="desc">Interactive OpenAPI 3.1 documentation for the gateway REST API.</p>
          </body>
          </html>
          INDEX

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
          commit_message: "Update docs: coverage + OpenAPI spec"

  # ─────────────────────────────────────────────────────────────────────────
  # Rolling "latest" release: on pushes to main, attach the per-platform
  # tarballs to a rolling "latest" GitHub Release. For stable versioned
  # releases, see release.yml (triggered by a release tag). PR builds upload
  # artifacts but do not create a release.
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Rolling latest release
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name 'seal-*.tar.gz' -o -name 'seal-*.sha256' \) \
            -exec cp {} release-assets/ \;
          ( cd release-assets && sha256sum seal-*.tar.gz > checksums-sha256.txt )
          echo "Release assets:"
          ls -la release-assets/

      - name: Update rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Seal Harness (latest from main)"
          body: "Automated build from commit ${{ github.sha }}."
          target_commitish: main
          files: |
            release-assets/seal-*.tar.gz
            release-assets/checksums-sha256.txt
          prerelease: true
