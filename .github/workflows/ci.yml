name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel outdated runs when a new push arrives on the same ref
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    # Map the optional S3-cache secrets to env so step-level `if` can test them.
    # (The `secrets` context is not permitted in `if` conditionals; `env` is.)
    env:
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
      NIX_CACHE_AWS_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_AWS_ACCESS_KEY_ID }}
      NIX_CACHE_AWS_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Restore Nix store cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Populate Nix store with dependencies
        run: nix develop --command true

      - name: Save Nix store cache
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          gc-max-store-size-linux: 5G
          gc-max-store-size-macos: 5G
          purge: true
          purge-created: 604800

      - name: Build
        run: nix build --print-build-logs

      - name: Run tests with coverage
        run: nix develop --command cabal test --enable-coverage

      # Upload the HPC artifacts (the .tix file + mix/html dirs) so the
      # coverage job can generate reports without re-running the test suite.
      # Only on linux — the coverage job runs there.
      - name: Stage HPC artifacts
        if: always() && matrix.system == 'x86_64-linux'
        run: |
          mkdir -p hpc-artifacts
          # The .tix file (the coverage data)
          TIX=$(find dist-newstyle -name "tests.tix" 2>/dev/null | head -1)
          if [ -n "$TIX" ]; then
            cp "$TIX" hpc-artifacts/tests.tix
          fi
          # The mix dirs (HPC index files mapping tick counts to source)
          find dist-newstyle -path "*/hpc/vanilla/mix" -type d 2>/dev/null | while read -r d; do
            rel=$(echo "$d" | sed 's|dist-newstyle/||')
            mkdir -p "hpc-artifacts/$(dirname "$rel")"
            cp -r "$d" "hpc-artifacts/$rel"
          done
          # The HTML report (auto-generated by cabal's coverage post-processing)
          HTML_DIR=$(find dist-newstyle -path "*/hpc/vanilla/html" -type d 2>/dev/null | head -1)
          if [ -n "$HTML_DIR" ]; then
            rel=$(echo "$HTML_DIR" | sed 's|dist-newstyle/||')
            mkdir -p "hpc-artifacts/$(dirname "$rel")"
            cp -r "$HTML_DIR" "hpc-artifacts/$rel"
          fi

      - name: Upload HPC artifacts
        if: always() && matrix.system == 'x86_64-linux'
        uses: actions/upload-artifact@v4
        with:
          name: hpc-artifacts
          path: hpc-artifacts/
          retention-days: 7

      # ─────────────────────────────────────────────────────────────────────
      # Optional: push built store paths to the S3 Nix binary cache.
      # Runs on pushes to main AND on same-repo PR branches, so PR builds also
      # warm the cache. The `env.NIX_CACHE_* != ''` guard is what excludes fork
      # PRs: GitHub withholds secrets from forks, so these are empty there and
      # the step is skipped. Also skipped when the secrets aren't configured.
      # ─────────────────────────────────────────────────────────────────────
      - name: Push to S3 Nix cache
        # if: env.NIX_CACHE_SIGNING_KEY != '' && env.NIX_CACHE_AWS_ACCESS_KEY_ID != ''
        # `nix copy --to s3://…` authenticates via the AWS SDK, which reads the
        # standard AWS_* env vars. The job-level NIX_CACHE_AWS_* vars exist only
        # so the `if` above can gate on them (secrets aren't allowed in `if`), so
        # re-export them here under the names the SDK actually looks for.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_AWS_SECRET_ACCESS_KEY }}
        run: |
          # Region must match the substituter URL in flake.nix.
          S3_CACHE='s3://${{ vars.NIX_CACHE_BUCKET }}'
          KEY=/tmp/nix-cache-priv-key.pem
          echo "$NIX_CACHE_SIGNING_KEY" > "$KEY"

          echo "Collecting store paths..."
          RESULT_PATHS=""
          if [ -e ./result ]; then
            RESULT_PATHS=$(nix-store -qR ./result)
          else
            echo "No ./result found, pushing dev shell only."
          fi

          DEVSHELL_OUT=$(nix build .#devShells.${{ matrix.system }}.default --print-out-paths --no-link 2>/dev/null || true)
          DEVSHELL_PATHS=""
          if [ -n "$DEVSHELL_OUT" ]; then
            DEVSHELL_PATHS=$(nix-store -qR $DEVSHELL_OUT)
          fi

          ALL_PATHS=$(echo -e "${RESULT_PATHS}\n${DEVSHELL_PATHS}" | sort -u | grep -v '^$')
          if [ -z "$ALL_PATHS" ]; then
            echo "No store paths to push."
            exit 0
          fi

          TOTAL=$(echo "$ALL_PATHS" | wc -l)
          echo "Signing and pushing $TOTAL store paths..."
          echo "$ALL_PATHS" | xargs nix store sign --key-file "$KEY"
          echo "$ALL_PATHS" | xargs nix copy --to "$S3_CACHE"
          echo "Cache push complete: $TOTAL paths."

  # ─────────────────────────────────────────────────────────────────────────
  # Coverage job: generates the HPC report, the OpenAPI spec, deploys the
  # coverage HTML + API docs to GitHub Pages, and posts a commit status with
  # the coverage summary to the PR. Runs on linux only, after the build job
  # succeeds (no point generating coverage for a failing build).
  # ─────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage & Docs
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      contents: write
      statuses: write

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Restore Nix store cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-Linux-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-Linux-

      - name: Populate Nix store with dependencies
        run: nix develop --command true

      - name: Build (for the seal binary)
        run: nix build --print-build-logs

      - name: Download HPC artifacts
        uses: actions/download-artifact@v4
        with:
          name: hpc-artifacts
          path: hpc-artifacts/

      - name: Generate coverage report
        run: |
          nix develop --command bash -c '
          TIX="hpc-artifacts/tests.tix"
          if [ ! -f "$TIX" ]; then
            echo "No .tix file found — coverage report skipped."
            echo "summary=No coverage data" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Collect all mix directories from the uploaded artifacts
          MIXDIRS=$(find hpc-artifacts -path "*/hpc/vanilla/mix" -type d 2>/dev/null)
          HPCDIR_ARGS=""
          for d in $MIXDIRS; do
            HPCDIR_ARGS="$HPCDIR_ARGS --hpcdir=$d"
          done

          # Generate text report (library modules only, exclude test harness)
          echo "=== HPC Coverage Report ==="
          REPORT=$(hpc report "$TIX" $HPCDIR_ARGS \
            --exclude=Main \
            --exclude=Paths_seal_harness \
            2>&1)
          echo "$REPORT"
          echo "$REPORT" > coverage-report.txt

          # Per-module breakdown
          echo ""
          echo "=== Per-Module Coverage ==="
          MODULE_REPORT=$(hpc report "$TIX" $HPCDIR_ARGS \
            --exclude=Main \
            --exclude=Paths_seal_harness \
            --per-module \
            2>&1)
          echo "$MODULE_REPORT"
          echo "$MODULE_REPORT" > coverage-per-module.txt
          '

      - name: Extract coverage summary
        id: coverage-summary
        if: always()
        run: |
          if [ ! -f coverage-report.txt ]; then
            echo "summary=No coverage data" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXPR=$(grep 'expressions used' coverage-report.txt | head -1 || true)
          BOOL=$(grep 'boolean coverage' coverage-report.txt | head -1 || true)
          TOPDECL=$(grep 'top-level declarations' coverage-report.txt | head -1 || true)

          EXPR_PCT=$(echo "$EXPR" | grep -o '[0-9]*%' | head -1 || true)
          BOOL_PCT=$(echo "$BOOL" | grep -o '[0-9]*%' | head -1 || true)
          TOPDECL_PCT=$(echo "$TOPDECL" | grep -o '[0-9]*%' | head -1 || true)

          SUMMARY="${EXPR_PCT:-?%} expressions, ${BOOL_PCT:-?%} booleans, ${TOPDECL_PCT:-?%} top-level decls"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Determine report path
        id: report-path
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dir=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Post coverage to job summary
        if: always()
        run: |
          REPORT_DIR="${{ steps.report-path.outputs.dir }}"
          PAGES_URL="https://seal-harness.github.io/seal-harness/coverage/${REPORT_DIR}/hpc_index.html"

          if [ ! -f coverage-report.txt ]; then
            echo "No coverage report found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Code Coverage (HPC)"
            echo ""
            echo "**[View full HTML report on GitHub Pages]($PAGES_URL)**"
            echo ""
            echo '```'
            cat coverage-report.txt
            echo '```'
            echo ""
            echo "<details>"
            echo "<summary>Per-module breakdown</summary>"
            echo ""
            echo '```'
            cat coverage-per-module.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # ─────────────────────────────────────────────────────────────────────
      # GitHub Pages: publish the HPC coverage HTML + the OpenAPI spec +
      # a Swagger UI page to gh-pages. Per-PR coverage is published to
      # coverage/pr-<N>/ so each PR gets its own report; the OpenAPI spec +
      # root index only update on pushes to main. A commit status with the
      # coverage summary + a link to the per-PR HTML is posted to the PR.
      # Patterned after pureclaw/.github/workflows/ci.yml.
      # ─────────────────────────────────────────────────────────────────────
      - name: Generate OpenAPI spec
        if: always()
        run: |
          # Use the already-built binary from the 'Build' step (the ./result
          # symlink created by `nix build`). cabal run would print build
          # progress to stdout, contaminating the JSON output.
          ./result/bin/seal gen-openapi > openapi.json
          if [ -s openapi.json ]; then
            echo "OpenAPI spec generated ($(wc -c < openapi.json) bytes)"
          else
            echo "OpenAPI spec generation failed — skipping Pages deploy"
          fi

      - name: Stage coverage HTML for Pages
        if: always()
        run: |
          HTML_DIR=$(find hpc-artifacts -path "*/hpc/vanilla/html" -type d 2>/dev/null | head -1)
          if [ -n "$HTML_DIR" ]; then
            mkdir -p new-coverage
            cp -r "$HTML_DIR"/* new-coverage/
            [ -f coverage-report.txt ] && cp coverage-report.txt new-coverage/summary.txt
          fi

      - name: Fetch existing gh-pages content
        if: always()
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-current
        continue-on-error: true

      - name: Assemble Pages content
        if: always()
        run: |
          REPORT_DIR="${{ steps.report-path.outputs.dir }}"
          mkdir -p deploy/coverage deploy/api

          # Carry forward existing content from gh-pages
          if [ -d gh-pages-current/coverage ]; then
            cp -r gh-pages-current/coverage/* deploy/coverage/ 2>/dev/null || true
          fi
          if [ -d gh-pages-current/api ]; then
            cp -r gh-pages-current/api/* deploy/api/ 2>/dev/null || true
          fi
          [ -f gh-pages-current/index.html ] && cp gh-pages-current/index.html deploy/index.html || true

          # Add (or overwrite) this build's coverage report
          rm -rf "deploy/coverage/${REPORT_DIR}"
          if [ -d new-coverage ]; then
            mkdir -p "deploy/coverage/${REPORT_DIR}"
            cp -r new-coverage/* "deploy/coverage/${REPORT_DIR}/"
          fi

          # OpenAPI spec + Swagger UI + root index only update on main pushes
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if [ -s openapi.json ]; then
              cp openapi.json deploy/api/openapi.json
            fi

            # Swagger UI page (loads the spec from the same directory)
            cat > deploy/api/index.html << 'SWAGGER'
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="utf-8">
              <title>Seal Harness API Docs</title>
              <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css">
            </head>
            <body>
              <div id="swagger-ui"></div>
              <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
              <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js"></script>
              <script>
                window.onload = function() {
                  SwaggerUIBundle({
                    url: 'openapi.json',
                    dom_id: '#swagger-ui',
                    deepLinking: true,
                    presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
                    layout: 'StandaloneLayout'
                  });
                };
              </script>
            </body>
            </html>
            SWAGGER

            # Root index linking to coverage + API docs
            cat > deploy/index.html << 'INDEX'
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="utf-8">
              <title>Seal Harness — Docs</title>
              <style>
                body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; color: #24292f; }
                h1 { border-bottom: 1px solid #d0d7de; padding-bottom: 8px; }
                a { color: #0969da; text-decoration: none; font-size: 1.1em; display: block; padding: 12px 0; }
                a:hover { text-decoration: underline; }
                .desc { color: #656d76; font-size: 0.9em; }
              </style>
            </head>
            <body>
              <h1>Seal Harness</h1>
              <a href="coverage/main/hpc_index.html">Code Coverage Report</a>
              <p class="desc">HPC line/branch coverage for the current main build.</p>
              <a href="api/index.html">API Docs (Swagger UI)</a>
              <p class="desc">Interactive OpenAPI 3.1 documentation for the gateway REST API.</p>
            </body>
            </html>
            INDEX
          fi

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
          commit_message: "Update docs: coverage + OpenAPI spec (${{ steps.report-path.outputs.dir }})"

      - name: Post coverage commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_DIR="${{ steps.report-path.outputs.dir }}"
          PAGES_URL="https://seal-harness.github.io/seal-harness/coverage/${REPORT_DIR}/hpc_index.html"
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SUMMARY="${{ steps.coverage-summary.outputs.summary }}"

          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success \
            -f context="coverage" \
            -f description="$SUMMARY" \
            -f target_url="$PAGES_URL"