name: Release

# Tag-triggered versioned releases. Push a tag like `git tag v0.1.0 && git push origin v0.1.0`
# to create an immutable GitHub Release with per-platform binaries + checksums.
# For bleeding-edge builds from main, see the rolling "latest" release in ci.yml.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Restore Nix store cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Populate Nix store with dependencies
        run: nix develop --command true

      - name: Build
        run: nix build --print-build-logs

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          TARGET="seal-${{ matrix.system }}"
          ARCHIVE="seal-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging
          cp ./result/bin/seal "staging/seal"
          tar czf "$ARCHIVE" -C staging seal
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "Packaged $ARCHIVE ($(wc -c < "$ARCHIVE") bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seal-${{ matrix.system }}
          path: |
            seal-*.tar.gz
            seal-*.tar.gz.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: |
          cat *.sha256 > checksums-sha256.txt
          echo "Release assets:"
          ls -la seal-*.tar.gz checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            seal-*.tar.gz
            checksums-sha256.txt